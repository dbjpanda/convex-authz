name: Sync SKILL.md

# Keeps skills/convex-authz/SKILL.md in sync with README.md.
# Triggered on push to main whenever README.md or the sync script changes.
# Decoupled from the release workflow so doc edits don't require a version bump.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/sync-skill.sh"
      - "skills/convex-authz/SKILL.md"

permissions:
  contents: write

concurrency:
  group: sync-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync SKILL.md from README
        run: bash scripts/sync-skill.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- skills/convex-authz/SKILL.md; then
            echo "No SKILL.md changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/convex-authz/SKILL.md
          git commit -m "docs: sync SKILL.md from README"
          git push
